<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球集锦 · 导入视频</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#1c3028;font:16px/1.7 system-ui,sans-serif}header,main,footer{max-width:920px;margin:auto;padding:24px}header{padding-top:34px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:750;letter-spacing:1px}.local{font-size:13px;background:#e4ece5;border-radius:24px;padding:5px 12px;color:#345843}.intro{margin:28px 0}h1{font-size:36px;line-height:1.4;letter-spacing:-1px;margin:0 0 12px}h2{font-size:21px;margin:0 0 12px}p{margin:8px 0;color:#5c6a60}.card{background:white;border:1px solid #dce3db;border-radius:16px;padding:28px;margin-bottom:24px}.pick{border:1px dashed #9eafa0;background:#fafbf8;padding:30px 20px;text-align:center;border-radius:12px}.file-label,button,.result-link{display:inline-block;background:#245c3f;color:white;border:1px solid #245c3f;border-radius:8px;padding:11px 23px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.file-label{background:white;color:#245c3f}input[type=file]{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.pick:focus-within{outline:3px solid #d9ac54;outline-offset:3px}.file-info{min-height:29px;word-break:break-all;margin-top:15px}button:disabled{opacity:.4;cursor:default}.start-row{margin-top:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hint{font-size:14px}.steps{display:flex;gap:20px;color:#647166;font-size:14px;margin-top:26px;flex-wrap:wrap}.steps span{display:flex;align-items:center;gap:8px}.steps b{background:#e6ece4;border-radius:50%;height:25px;width:25px;text-align:center;color:#375240}.error{color:#a13c2c;white-space:pre-line}progress{width:100%;height:14px;accent-color:#245c3f;margin:12px 0}.job{padding:14px 0;border-top:1px solid #e3e8e0;display:flex;align-items:center;justify-content:space-between;gap:16px}.job:first-child{border-top:0}.filename{overflow-wrap:anywhere;font-weight:550}.job p{font-size:14px;margin:2px 0}a{color:#245c3f}a:focus-visible,button:focus-visible{outline:3px solid #d9ac54;outline-offset:3px}footer{font-size:13px;color:#657166;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}#history:empty:after{content:'处理完成的视频会保存在这里。';color:#788178;font-size:14px}#status-name{overflow-wrap:anywhere}#review-link{margin-top:12px}[hidden]{display:none!important}@media(max-width:600px){header,main,footer{padding:18px}h1{font-size:29px}.card{padding:20px}.pick{padding:24px 12px}.job{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="brand">◉ 球场集锦</div><span class="local">本机处理 · 保留原声</span></header>
<main><div class="intro"><h1>导入比赛视频，生成进球集锦</h1><p>选择电脑里的视频，分析完成后确认进球片段，即可导出集锦。</p></div>
<section class="card" aria-labelledby="upload-title"><h2 id="upload-title">选择本地视频</h2><p class="hint">适用于固定机位或轻微晃动、篮网清晰可见的视频。建议先用短片段体验。</p>
<div class="pick"><label class="file-label" for="video-file">选择本地视频</label><input type="file" id="video-file" aria-label="选择本地视频" accept="video/*,.mkv,.m4v"><div id="file-info" class="file-info" aria-live="polite">尚未选择视频</div><p class="hint">MP4、MOV、MKV、AVI、WEBM、M4V · 单个文件不超过 8 GB</p></div>
<div class="start-row"><button id="start" disabled>开始分析</button><span class="hint">视频只导入到这台电脑上的本地服务。</span></div><p id="error" class="error" role="alert"></p><p id="busy-note" class="hint" hidden>已有视频正在处理中，完成后可导入下一个。</p>
<div class="steps"><span><b>1</b> 选择视频</span><span><b>2</b> 分析进球</span><span><b>3</b> 确认并导出</span></div></section>
<section class="card" id="status-card" hidden aria-labelledby="status-title"><h2 id="status-title">正在导入</h2><p id="status-name"></p><progress id="progress" max="100" value="0" aria-label="视频导入进度"></progress><p id="status-text" role="status" aria-live="polite"></p><p id="elapsed" class="hint"></p><a id="review-link" class="result-link" hidden>查看结果并确认</a></section>
<section class="card"><h2>最近处理的视频</h2><div id="history"></div></section></main>
<footer><span>处理速度取决于视频长度。完成后可逐个复核进球片段。</span><a id="example" href="/examples/indoor/review/" hidden>查看示例结果</a></footer>
<noscript>请启用 JavaScript 后选择视频。</noscript><script>
const exampleEnabled=/*EXAMPLE_ENABLED*/false;
const el=id=>document.getElementById(id),input=el('video-file');
let file=null,uploading=false,activeId=null,currentId=new URL(location.href).searchParams.get('job'),currentJob=null;
const names={uploading:'正在导入',queued:'等待开始分析',running:'正在分析',ready_for_review:'分析完成',unsupported:'暂不支持此视频',failed:'处理未完成',interrupted:'处理已中断'};
const size=n=>n>=1024**3?(n/1024**3).toFixed(2)+' GB':(n/1024**2).toFixed(1)+' MB';
const duration=n=>{const s=Math.max(0,Math.floor(n||0));return `${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`};
el('example').hidden=!exampleEnabled;
function update(){el('start').disabled=!file||uploading||!!activeId;input.disabled=uploading;el('busy-note').hidden=!activeId||uploading;}
input.addEventListener('change',()=>{file=input.files?.[0]||null;el('error').textContent='';el('file-info').textContent=file?`${file.name} · ${size(file.size)}`:'尚未选择视频';if(file&&(file.size===0||file.size>8*1024**3)){el('error').textContent='视频不能为空，且单个文件不能超过 8 GB。';file=null;}update();});
function renderJob(job){currentJob=job;el('status-card').hidden=false;el('status-title').textContent=names[job.status]||'正在处理';el('status-name').textContent=job.filename;el('review-link').hidden=job.status!=='ready_for_review';el('progress').hidden=['ready_for_review','unsupported','failed','interrupted'].includes(job.status);el('progress').setAttribute('aria-label','当前步骤进度');el('progress').removeAttribute('value');
 const p=job.progress;let text=job.message||p?.label||job.stage||'视频已导入本机，请稍候。';if(job.status==='ready_for_review')text=`自动计入 ${job.counts.supported} 个，待确认 ${job.counts.uncertain} 个。`;
 if(job.status==='running'&&p?.completed_frames!=null&&p.total_frames){text+=` · 已处理 ${p.completed_frames} / ${p.total_frames} 帧（当前步骤）`;el('progress').value=p.completed_frames/p.total_frames*100;}el('status-text').textContent=text;if(job.review_url)el('review-link').href=job.review_url;
 const measured=job.elapsed_seconds??(['queued','running'].includes(job.status)?(Date.now()-Date.parse(job.created_at_utc))/1000:null);const timing=measured==null?'处理已完成':`${job.status==='ready_for_review'?'总耗时':'已用时'} ${duration(measured)}`;el('elapsed').textContent=timing;if(job.status==='running')el('elapsed').textContent+=p?.quiet?' · 本阶段较久没有新的进度记录，仍在等待处理结果。':(p?` · 最近更新：${duration(p.last_activity_seconds)}前。刷新后仍可查看任务。`:' · 正在处理，刷新后仍可查看任务。');
}
function renderHistory(jobs){el('history').replaceChildren();for(const job of jobs){const row=document.createElement('div');row.className='job';const info=document.createElement('div'),name=document.createElement('div'),p=document.createElement('p');name.className='filename';name.textContent=job.filename;p.textContent=`${size(job.size_bytes)} · ${names[job.status]||'处理中'}`;info.append(name,p);const a=document.createElement('a');a.textContent=job.status==='ready_for_review'?'查看结果':'查看状态';a.href=job.review_url||'/?job='+job.id;row.append(info,a);el('history').append(row);}}
async function refresh(){try{const response=await fetch('/api/jobs',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();activeId=data.active_id;renderHistory(data.jobs);if(currentId&&!uploading){let job=data.jobs.find(j=>j.id===currentId);if(!job){const r=await fetch('/api/jobs/'+encodeURIComponent(currentId));if(r.ok)job=await r.json();}if(job)renderJob(job);}update();}catch(e){el('error').textContent='无法连接本地服务，请确认服务正在运行后刷新页面。';}setTimeout(refresh,1500);}
el('start').addEventListener('click',()=>{if(!file||uploading||activeId)return;uploading=true;currentId=null;el('error').textContent='';el('status-card').hidden=false;el('status-title').textContent='正在导入到本机';el('status-name').textContent=file.name;el('status-text').textContent='导入完成后将自动开始分析。';el('elapsed').textContent='';el('review-link').hidden=true;el('progress').hidden=false;el('progress').value=0;update();
 el('progress').setAttribute('aria-label','视频导入进度');const request=new XMLHttpRequest();request.open('POST','/api/uploads?filename='+encodeURIComponent(file.name));request.setRequestHeader('Content-Type','application/octet-stream');request.upload.addEventListener('progress',e=>{if(e.lengthComputable){const percent=Math.round(e.loaded/e.total*100);el('progress').value=percent;el('status-text').textContent=`已导入 ${percent}%`;if(percent===100)el('status-text').textContent='视频已导入本机，正在准备分析…';}});
 request.addEventListener('load',()=>{uploading=false;try{const job=JSON.parse(request.responseText);if(request.status!==202)throw Error(job.error||'导入失败，请重试。');currentId=job.id;activeId=job.id;history.replaceState({},'', '/?job='+job.id);renderJob(job);}catch(e){el('error').textContent=e.message;el('status-title').textContent='导入未完成';el('progress').hidden=true;el('status-text').textContent='请重新选择文件或重试。';}update();});
 request.addEventListener('error',()=>{uploading=false;el('error').textContent='导入连接中断，请重试。';el('status-title').textContent='导入未完成';el('progress').hidden=true;update();});request.send(file);
});
refresh();
</script></body></html>
